# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu toolhead]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: f381301b3cda

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: toolhead:PA2

[adxl345]
cs_pin: toolhead:PB12
spi_software_sclk_pin: toolhead:PB10
spi_software_mosi_pin: toolhead:PB11
spi_software_miso_pin: toolhead:PB2
axes_map: z, -y, x

[firmware_retraction]
retract_length: 0.6
retract_speed: 35
unretract_speed: 30

[extruder]
step_pin: toolhead:PD0
dir_pin: toolhead:PD1
enable_pin: !toolhead:PD2
microsteps: 16
full_steps_per_rotation: 200 # 200 for 1.8 degree, 400 for 0.9 degree
rotation_distance: 47.088 # Galileo 2 Extruder
gear_ratio: 9:1 # Galileo 2 Extruder
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead:PB13
sensor_type: MAX31865
sensor_pin: toolhead:PA4
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
min_temp: 10
max_temp: 290
max_power: 1.0
min_extrude_temp: 180
#control: pid
#pid_Kp: 21.221
#pid_Ki: 1.608
#pid_Kd: 70.029
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.042
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5
max_extrude_only_distance: 600 # default is 50mm

[tmc2209 extruder]
uart_pin: toolhead:PA15
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0
run_current: 0.6 # 0.6 Galileo 2 /// # 0.7 Orbiter v2
hold_current: 0.3 # 0.3 Galileo 2 /// # 0.5 Orbiter v2
sense_resistor: 0.11
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan]
pin: toolhead:PA1
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
pin: toolhead:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

[stepper_x]
endstop_pin: toolhead:PB6

