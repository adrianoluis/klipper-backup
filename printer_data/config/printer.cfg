# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths              [mcu] section
## Thermistor types           [extruder] and [heater_bed] sections - See https: //www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Hotend heater pin          [extruder] section
## Z Endstop Switch location      [safe_z_home] section
## Homing end position          [gcode_macro G32] section
## Z Endstop Switch  offset for Z0    [stepper_z] section
## Stepper Z1 enable pin        [stepper_z1] section
## Probe points             [quad_gantry_level] section
## Min & Max gantry corner postions   [quad_gantry_level] section
## PID tune               [extruder] and [heater_bed] sections
## Probe pin              [probe] section
## Fine tune E steps          [extruder] section

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2A0037000F50535556323420-if00
restart_method: command

[mcu toolhead]
canbus_uuid: f381301b3cda

[printer]
kinematics: corexy
max_velocity: 450  
max_accel: 5100       # Max 4000
max_z_velocity: 20    # Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   General Settings
#####################################################################

[idle_timeout]
timeout: 1800
gcode:
  RESPOND MSG="Idle timeout reached"
  TURN_OFF_HEATERS
  M84
  LIGHT_OFF
  STATUS_OFF

[pause_resume]
[display_status]
[exclude_object]
[respond]

##  Required by BD Sensor command SET_KINEMATIC_POSITION
[force_move]
enable_force_move: True # required by the command SET_KINEMATIC_POSITION in the calibration step below.

##  Orca Slicer must have config:
##  Enable arcs support
[gcode_arcs]
resolution: 0.1

#####################################################################
#   Accelerometer and Input Shapping
#####################################################################

[resonance_tester]
accel_chip: adxl345
probe_points:  
  175, 175, 20

[input_shaper]
shaper_freq_x: 109.4
shaper_type_x: 3hump_ei
shaper_freq_y: 40.4
shaper_type_y: mzv

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
#endstop_pin: PG6
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 70
homing_retract_dist: 5
homing_positive_dir: True

[tmc5160 stepper_x]
cs_pin: PC4
run_current: 0.8
hold_current: 0.1
interpolate: True
stealthchop_threshold: 10000
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
endstop_pin: PG9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 357
position_max: 357
homing_speed: 70
homing_retract_dist: 5
homing_positive_dir: True

[tmc5160 stepper_y]
cs_pin: PD11
run_current: 0.8
hold_current: 0.1
interpolate: True
stealthchop_threshold: 10000
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
#endstop_pin: PG10
endstop_pin: probe:z_virtual_endstop
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
#position_endstop: 0.0
position_max: 310
position_min: -3
homing_speed: 5
second_homing_speed: 3  #set this to 3 if homing with collision
homing_retract_speed: 2
homing_retract_dist: 5

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.8
hold_current: 0.1
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80: 16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.8
hold_current: 0.1
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80: 16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
run_current: 0.8
hold_current: 0.1
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80: 16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE4
run_current: 0.8
hold_current: 0.1
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Fan Control
#####################################################################

##  Controller fan - FAN2
[controller_fan controller_fan]
pin: PD12
#kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.60

#####################################################################
#   Temperature Monitor and Control
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor mcu]
sensor_type: temperature_mcu

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[temperature_fan chamber]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.01
off_below: 0.1
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 70
target_temp: 45.0
control: watermark
gcode_id: C

#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
pin: PB10
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001


#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
home_xy_position: 175, 154.5
speed: 100
z_hop: 5

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
  -60, -10
  410, 420
points:
  50, 25
  50, 275
  300, 275
  300, 25
speed: 350
horizontal_move_z: 1.0 # 0.7~1.0mm is recommended
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 350
horizontal_move_z: 1.0 # 0.7~1.0mm is recommended
algorithm: bicubic  # this should be bicubic if the bed mesh points count is > 6*6
mesh_min: 25, 25
mesh_max: 325, 325
probe_count: 9, 9
fade_start: 0.8
fade_end: 12.0
zero_reference_position: 175, 154.5 # Set this value to be the same as home_xy_position that is in the section safe_z_home

#[axis_twist_compensation]
#speed: 50
##   The speed (in mm/s) of non-probing moves during the calibration.
##   The default is 50.
#horizontal_move_z: 2.0
##   The height (in mm) that the head should be commanded to move to
##   just prior to starting a probe operation. The default is 5.
#calibrate_start_y: 20.5
##   Defines the minimum Y coordinate of the calibration
##   This should be the Y coordinate that positions the nozzle at the starting
##   calibration position for the Y axis. This parameter must be provided if
##   compensating for Y axis twist.
#calibrate_end_y: 325.0
##   Defines the maximum Y coordinate of the calibration
##   This should be the Y coordinate that positions the nozzle at the ending
##   calibration position for the Y axis. This parameter must be provided if
##   compensating for Y axis twist.
#calibrate_x: 212.5
##   Defines the X coordinate of the calibration for Y axis twist compensation
##   This should be the X coordinate that positions the nozzle during the
##   calibration process for Y axis twist compensation. This parameter must be
##   provided and is recommended to be near the center of the bed.

