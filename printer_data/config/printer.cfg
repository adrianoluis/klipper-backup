##  Mainsail required import
[include client_variables.cfg]
[include mainsail.cfg]
[include timelapse.cfg]

##  Hardware settings
[include _ebb36.cfg]
[include _eddy.cfg]
[include _rpi.cfg]
[include Orbiter2_SmartSensor.cfg]
[include dragonburner_leds.cfg]
[include nevermore.cfg]

##  Custom configurations
[include macros/*.cfg]
#[include autotune_tmc.cfg]
[include KAMP_Settings.cfg]

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4D004C0006504E5238363120-if00
#restart_method: command

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 2200
max_z_velocity: 50
max_z_accel: 2200
square_corner_velocity: 5.0

[force_move] 
enable_force_move: True

[static_digital_output usb_pullup_enable]
pins: !PC13

##  Orca Slicer must have config:
##  Enable arcs support
[gcode_arcs]
resolution: 0.1

#  Enables support to exclude or cancel individual objects during the printing process.
[exclude_object]

#####################################################################
#   Accelerometer and Input Shapping
#####################################################################

[resonance_tester]
# Assuming the typical setup of the bed slinger printer
accel_chip_x: adxl345 hotend
accel_chip_y: adxl345 bed
probe_points:  
  110, 110, 20

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 90.2
shaper_type_y: mzv
shaper_freq_y: 29.6

#####################################################################
#   X Stepper Settings
#####################################################################

######
# Motor -XM
# Endstop - X-STOP
###############
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
rotation_distance: 40
microsteps: 16
endstop_pin: ^toolhead:PB5
position_endstop: 220
position_min: 0
position_max: 220
homing_speed: 55

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.58
hold_current: 0.12
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

#####################################################################
#   Y Stepper Settings
#####################################################################

######
# Motor -YM
# Endstop - Y-STOP
###############
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
rotation_distance: 40
microsteps: 16
## Ucomment one of the following:
## Switch-based endstop for Y
endstop_pin: ^PC1 
## Sensorless endstop for Y
#endstop_pin: tmc2209_stepper_y:virtual_endstop
#homing_retract_dist: 0 # Uncomment this line too
position_endstop: -3
position_min: -3
position_max: 239
homing_speed: 55

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.58
hold_current: 0.12
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0
## Uncomment if using sensorless Y homing.
#driver_SGTHRS: 120 # tune this once it's working.

#####################################################################
#   Z Stepper Settings
#####################################################################

######
# Motor -ZAM
# Endstop - Z-STOP
###############
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
rotation_distance: 40
microsteps: 16
endstop_pin: probe:z_virtual_endstop
;position_endstop: 0
position_min: -3
position_max: 234
homing_speed: 25

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.58
hold_current: 0.12
# Recommended by Klipper TMC Autotune
interpolate: True
;stealthchop_threshold: 0

#####################################################################
# 	Bed Heater
#####################################################################

######
# BED Connector
###############
[heater_bed]
heater_pin: PC9
##  Validate the following thermistor type to make sure it is correct
##  See https://www.klipper3d.org/Config_Reference.html#common-thermistors for additional options
sensor_type: NTC 100K MGB18-104F39050L32 # ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 130
#control: pid
#pid_Kp: 72.291
#pid_Ki: 1.381
#pid_Kd: 946.110

#####################################################################
# 	Fan Control
#####################################################################

######
# Electronics Fan
# FAN1 Connector
###############
[controller_fan controller_fan]
pin: PC7 
max_power: 1.00
kick_start_time: 0.200
heater: heater_bed
fan_speed: 0.60

#####################################################################
#   Temperature control
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor main_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber]
sensor_pin: PA0
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp: 0
max_temp: 100

#####################################################################
#   Homing and Bed Mesh
#####################################################################

[screws_tilt_adjust]
screw1: 29, 2
screw1_name: Front left
screw2: 195, 2
screw2_name: Front right
screw3: 195, 182
screw3_name: Back right
screw4: 29, 182
screw4_name: Back left
screw_thread: CW-M4
horizontal_move_z: 2
speed: 200

