[BDsensor]
sda_pin: toolhead:PB8
scl_pin: toolhead:PB9
delay: 10              # you can set it 10 if the BDsensor version is >=1.2
z_offset: -0.055       # within -0.6 to 0.6mm (acts the opostide of z-offset adjustment from the UI)
x_offset: 0.0
y_offset: 20.5
no_stop_probe:         # fast probe that the toolhead will not stop at the probe point,disable it by commenting out.
position_endstop: 1.2  # the triggered position, recommend value is 1~2.8
collision_homing: 1    # set it 1 to enable homing with nozzle collision sensing.
collision_calibrate: 1 # set it 1 to enable auto calibrate BDsensor with nozzle collision sensing.
#QGL_Tilt_Probe: 0     # set 1 to enable probe up and down when do quad_gantry_level
speed: 3.0             # this speed only works for the z tilt and PROBE_ACCURACY command.
homing_cmd: G990028    # needed by the auto calibration.the default is G28, please set it G990028 if there has [gcode_macro G28]
#samples: 3             # readings taken per probe point, the default is 1. only applies where the toolhead stops (QGL, Z tilt, PROBE, PROBE_ACCURACY).
samples_result: average # median or average, the default is average. only average can resolve below the sensor's 0.01mm step, median stays on it.
samples_tolerance: 0.1 # max spread (mm) allowed across those samples, the default is 0.1. dormant while samples is 1.
samples_tolerance_retries: 2 # retries before aborting on the spread above, the default is 0 which aborts on the first violation.

## the homing_retract_dist in the [stepper_z] must be 0
[gcode_macro G28]
rename_existing: G990028
gcode:
  {% if params|length > 1 %}
    {% if ('x' in params or 'X' in params) and ('y' in params or 'Y' in params)  %}
      { action_respond_info("homing x and y") }
      G990028 X Y
    {% else %}
      {% if 'x' in params or 'X' in params  %}
        { action_respond_info("homing x") }
        G990028 X
      {% endif %}
      {% if 'y' in params or 'Y' in params  %}
        { action_respond_info("homing y") }
        G990028 Y
      {% endif %}
      {% if 'z' in params or 'Z' in params  %}
        { action_respond_info("homing z") }
        ## Homing with contactless probe with the homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=0
        G990028 Z
        ## Homing with contact probe with the second_homing_speed in [stepper_z]
        BDSENSOR_SET COLLISION_HOMING=1
        G990028 Z
      {% endif %}
    {% endif %}
  {% else %}
    { action_respond_info("homing all") }
    G990028 X Y
    ## Homing with contactless probe with the homing_speed in [stepper_z]
    BDSENSOR_SET COLLISION_HOMING=0
    G990028 Z
    ## Homing with contact probe with the second_homing_speed in [stepper_z]
    BDSENSOR_SET COLLISION_HOMING=1
    G990028 Z
  {% endif %}

#####################################################################
#   Custom QUAD_GANTRY_LEVEL
#####################################################################
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description:
gcode:
  #run z tilt with z move up and down at first
  BDSENSOR_SET QGL_TILT_PROBE=1 #set this 1 to enable z axis up and down
  BDSENSOR_SET COLLISION_HOMING=0
  _QUAD_GANTRY_LEVEL horizontal_move_z=6 retry_tolerance=1
  G28 Z0
  #run z tilt with no z move up and down
  BDSENSOR_SET QGL_TILT_PROBE=0 #set this 0 to disable z axis up and down while probe
  _QUAD_GANTRY_LEVEL horizontal_move_z=1 retry_tolerance=0.04
  #BDSENSOR_SET COLLISION_HOMING=1 #optional
  G28 Z0
